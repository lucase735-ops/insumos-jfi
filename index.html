<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5130">
<title>Controle de Insumos JFI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--verde:#1f5130;--verde2:#2e7344;--claro:#eaf2e3;--fundo:#f4f6f2;--txt:#1d2a20;--cinza:#6b7a6f;--borda:#d5ddd3;--erro:#b3261e;--alerta:#a15c00;--ok:#1e7a3c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:10px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header small{display:block;font-weight:400;opacity:.85;font-size:12px}
.net{font-size:11px;padding:3px 8px;border-radius:10px;background:#ffffff26}
.net.off{background:#ffb4a9;color:#410002}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--cinza)}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--verde);font-weight:700}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--cinza);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:11px 10px;border:1px solid var(--borda);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde2);border-color:transparent}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:var(--verde);color:#fff;margin-top:12px}
.btn.sec{background:var(--claro);color:var(--verde)}
.btn.perigo{background:#fde7e4;color:var(--erro)}
.btn.peq{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:0}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px 10px;text-align:center;font-weight:600;font-size:14px;color:var(--verde)}
.tile b{display:block;font-size:28px;margin-bottom:4px}
.lin{border:1px dashed var(--borda);border-radius:10px;padding:10px;margin-top:10px;background:#fbfcfa}
.info{font-size:13px;color:var(--cinza)}
.prev{font-size:12px;color:var(--verde2);margin-top:3px;min-height:15px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;background:var(--claro);color:var(--verde);font-weight:600}
.tag.al{background:#ffe8c7;color:var(--alerta)}.tag.er{background:#fde7e4;color:var(--erro)}.tag.cz{background:#eceeea;color:var(--cinza)}
.aviso{border-radius:8px;padding:9px 10px;font-size:13px;margin-top:8px}
body:not(.gestor) nav button[data-v=desvios]{display:none}
body.gestor nav button[data-v=saldo],body.gestor nav button[data-v=lancar],body.gestor nav button[data-v=fechar],body.gestor nav button[data-v=hist]{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:12px;color:#555}.kpi.ok b{color:#0f6b2f}.kpi.er b{color:#b3261e}.kpi.al b{color:#8a5200}
.dv{border-left:6px solid #bbb;padding:8px 10px;margin-bottom:8px;background:#fff;border-radius:8px;border-top:1px solid var(--borda);border-right:1px solid var(--borda);border-bottom:1px solid var(--borda)}
.dv.ok{border-left-color:#2e8b4a}.dv.er{border-left-color:#c62828}.dv.al{border-left-color:#e09b1a}.dv h4{margin:0 0 2px;font-size:14px}.dv p{margin:0;font-size:13px;color:#333}.dv .pc{float:right;font-weight:700;font-size:16px}
.aviso.al{background:#fff4e2;color:#6b3d00}.aviso.er{background:#fde7e4;color:#7a1610}.aviso.ok{background:#e5f4e9;color:#0f4d24}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #edf0ec;vertical-align:top}
th{font-size:12px;color:var(--cinza);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--erro);font-weight:700}
.mov{padding:10px 0;border-bottom:1px solid #edf0ec}
.mov .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.mov .s{font-size:12.5px;color:var(--cinza)}
pre.msg{white-space:pre-wrap;background:#f0f5ec;border-radius:8px;padding:10px;font-size:13px;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2a20;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.x{float:right;border:0;background:none;color:var(--erro);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Insumos JFI <small id="hdr">—</small></h1>
  <span id="net" class="net">online</span>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-v="saldo"><b>📦</b>Saldo</button>
  <button data-v="lancar"><b>➕</b>Lançar</button>
  <button data-v="fechar"><b>✅</b>Estoque</button>
  <button data-v="hist"><b>🗂️</b>Histórico</button>
  <button data-v="desvios"><b>📊</b>Desvios</button>
  <button data-v="mais"><b>⚙️</b>Mais</button>
</nav>

<script>
/* =====================================================================
   CONTROLE DE INSUMOS – JFI x INFINITI  (v1.0.0)
   Funciona offline. Dados ficam no próprio celular (localStorage).
   Cada lançamento recebe um ID único (DISPOSITIVO-SEQUÊNCIA) e nunca é
   apagado: correções são feitas por ESTORNO, mantendo a trilha de auditoria.
   ===================================================================== */
const VERSAO = '3.2.0';
const KEY = 'jfi_insumos_v1';

const TIPOS = {
  SALDO_INICIAL:   {nome:'Primeiro estoque de campo', sinal:+1, cor:''},
  ENTRADA_NF:      {nome:'Entrada por NF', sinal:+1, cor:''},
  TRANSF_RECEBIDA: {nome:'Transferência recebida', sinal:+1, cor:''},
  CONSUMO:         {nome:'Consumo não apontado (exceção)', sinal:-1, cor:'al'},
  DEVOLUCAO:       {nome:'Devolução ao cliente', sinal:-1, cor:''},
  TRANSF_ENVIADA:  {nome:'Transferência enviada', sinal:-1, cor:''},
  PERDA:           {nome:'Perda / avaria', sinal:-1, cor:'al'},
  AJUSTE:          {nome:'Ajuste de inventário', sinal:0, cor:'al'},
  ESTORNO:         {nome:'Estorno', sinal:0, cor:'cz'},
  CONTAGEM:        {nome:'Fechamento: contagem e consumo do dia', sinal:0, cor:''}
};

let CFG = null; // cadastros centrais (config.json), mantidos pelo analista

/* ---------------- Armazenamento ---------------- */
function novoDB(){
  const id = Array.from({length:4},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  return {versao:VERSAO, config:{dispositivo:id, lider:'', equipe:'', supervisor:'', fazenda:'Simmenthal',
    fazendas:[], tolDose:5, tolInv:2, pin:'', seq:0, ultimoExport:0, urlPlanilha:'', chave:'', ultimoSync:0, syncEm:''},
    produtos:[], cfg:null, movs:[], fechados:{}};
}
let DB;
try{ DB = JSON.parse(localStorage.getItem(KEY)) || novoDB(); }catch(e){ DB = novoDB(); }
function salvar(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ alert('ATENÇÃO: não foi possível salvar no celular ('+e.message+'). Exporte o backup agora.'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const agora = () => new Date().toISOString();
const dBR = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
function num(v){ // aceita "1.234,5" "1234,5" "12.5"
  if (v===null||v===undefined) return NaN; v=String(v).trim().replace(/\s/g,''); if(!v) return NaN;
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',', '.');
  return Number(v);
}
const fmt = (n,c=2) => (isFinite(n)? Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:c}) : '—');
const prod = cod => DB.produtos.find(p=>p.cod===cod) || {cod, nome:cod, un:'', dose:null};
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const optFaz = sel => DB.config.fazendas.map(f=>`<option ${f===sel?'selected':''}>${esc(f)}</option>`).join('');
const optProd = sel => '<option value="">— selecione —</option>'+DB.produtos.map(p=>`<option value="${esc(p.cod)}" ${p.cod===sel?'selected':''}>${esc(p.nome)} (${esc(p.un)})</option>`).join('');

/* Seleção em lista (o líder não digita): guarda o valor escolhido num campo oculto com o id original */
function sel(id, lista, o={}){ const v=o.val||'', tem=(lista||[]).includes(v);
  return `<select id="${id}_s" onchange="selCh('${id}')"><option value="">${o.vazio||'— selecione —'}</option>${(lista||[]).map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${o.outro===false?'':'<option value="__o">Outro (descrever)</option>'}</select><input id="${id}_o" style="display:none;margin-top:6px" placeholder="Descreva" oninput="selCh('${id}')"><input type="hidden" id="${id}" value="${tem?esc(v):''}">`; }
function selCh(id){ const s=$('#'+id+'_s').value, o=$('#'+id+'_o'); o.style.display = s==='__o'?'':'none'; $('#'+id).value = s==='__o'? o.value : s; }
const M = k => (CFG&&CFG.motivos&&CFG.motivos[k])||[];
const optTal = (faz,v) => '<option value="">—</option>'+((CFG&&CFG.fazendas[faz])||[]).map(t=>`<option ${t===v?'selected':''}>${esc(t)}</option>`).join('');
function aplicarCfg(){ CFG=DB.cfg; if(!CFG) return; DB.produtos=CFG.produtos; const c=DB.config; c.tolDose=CFG.tolDose||5; c.tolInv=CFG.tolInv||2; c.urlPlanilha=CFG.urlPlanilha||''; c.chave=CFG.chave||'';
  if(!CFG.gestores) CFG.gestores=(CFG.supervisores||[]).map(n=>({nome:n,perfil:'Supervisor'}));
  if(c.gestor){ const g=CFG.gestores.find(x=>x.nome===c.lider); if(g) c.gestor=g.perfil; c.equipe=''; c.fazendas=Object.keys(CFG.fazendas); if(!c.fazendas.includes(c.fazenda)) c.fazenda=c.fazendas[0]; return; }
  const l=CFG.lideres.find(x=>x.nome===c.lider); if(l){ c.equipe=l.equipe; c.fazendas=l.fazendas; if(!l.fazendas.includes(c.fazenda)) c.fazenda=l.fazendas[0]; } }
async function baixarCfg(manual){ try{ const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; let j=await r.json();
    if(j.urlCadastros){ /* cadastros mantidos pelo analista na planilha do Google Drive */
      try{ const r2=await fetch(j.urlCadastros+'?cfg=1&t='+Date.now()); const p=await r2.json(); if(!p.lideres||!p.produtos||!p.lideres.length) throw 0;
        p.urlPlanilha=j.urlCadastros; p.chave=j.chave||''; j=p; }
      catch(e){ if(DB.cfg){ if(manual) alert('Não foi possível ler os cadastros da planilha agora. O app continua com a última lista baixada.'); return false; } }
    }
    if(!j.lideres||!j.produtos) throw 0;
    const mudou=!DB.cfg||DB.cfg.versao!==j.versao; DB.cfg=j; aplicarCfg(); salvar(); if(manual) toast(mudou?'Cadastros atualizados ✔ (versão '+j.versao+')':'Cadastros já estão em dia ✔'); if(mudou||manual) go(DB.config.lider?VIEW:'config'); return true;
  }catch(e){ if(manual) alert('Não foi possível baixar os cadastros. Verifique a internet.'); return false; } }

/* Saldo = soma de mov (quantidade já com sinal) por fazenda+produto, até a data (inclusive) */
function saldo(faz, cod, ateData){
  return DB.movs.reduce((s,m)=> (m.fazenda===faz && m.cod===cod && (!ateData || m.data<=ateData)) ? s + (m.mov||0) : s, 0);
}
function estornado(id){ return DB.movs.some(m=>m.tipo==='ESTORNO' && m.ref===id); }

function registrar(o){
  DB.config.seq++;
  const m = Object.assign({
    id: DB.config.dispositivo+'-'+String(DB.config.seq).padStart(6,'0'),
    seq: DB.config.seq, dispositivo: DB.config.dispositivo, lider: DB.config.lider,
    criado: agora(), ref:'', obs:'', aposFechamento: DB.fechados[(o.fazenda||'')+'|'+o.data] ? 'SIM':'' }, o);
  const p = prod(m.cod); m.produto = p.nome; m.un = p.un;
  if (m.mov===undefined){ const sg = TIPOS[m.tipo].sinal; m.mov = sg * (m.qtd||0); }
  m.mov = Math.round(m.mov*1000)/1000;
  DB.movs.push(m); return m;
}

/* ---------------- Navegação ---------------- */
let VIEW='saldo';
document.querySelectorAll('nav button').forEach(b=> b.onclick=()=>go(b.dataset.v));
function go(v, arg){
  if((!DB.config.lider||!CFG) && v!=='config'){ v='config'; }
  document.body.classList.toggle('gestor', !!DB.config.gestor);
  if(DB.config.gestor && !['desvios','mais','config'].includes(v)) v='desvios';
  if(!DB.config.gestor && v==='desvios') v='saldo';
  VIEW=v; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v || (v.startsWith('f_') && b.dataset.v==='lancar')));
  (VIEWS[v]||VIEWS.saldo)(arg); window.scrollTo(0,0); hdr();
}
function hdr(){ const c=DB.config; $('#hdr').textContent = c.lider ? (c.gestor ? c.lider+' · '+c.gestor+' · indicadores' : c.lider+(c.equipe?' · eq. '+c.equipe:'')+' · '+c.fazenda+' · '+c.dispositivo) : 'entre com seu nome'; }
function net(){ const n=$('#net'); n.textContent = navigator.onLine?'online':'offline'; n.classList.toggle('off', !navigator.onLine); }
addEventListener('online',net); addEventListener('offline',net);

/* Campo numérico com prévia formatada (evita "4.200" virar 4,2 sem perceber) */
function campoNum(id, rot, un, val=''){
  return `<label for="${id}">${rot}</label><input id="${id}" inputmode="decimal" autocomplete="off" value="${esc(val)}" oninput="prevNum(this,'${un}')"><div class="prev" id="${id}_p"></div>`;
}
function prevNum(el, un){ const n=num(el.value); const p=document.getElementById(el.id+'_p'); if(p) p.textContent = el.value? (isFinite(n)? '= '+fmt(n,3)+' '+(un||'') : '⚠ número inválido') : ''; }

const VIEWS = {};

/* ================= SALDO ================= */
VIEWS.saldo = ()=>{
  const faz = DB.config.fazenda;
  const cods = [...new Set(DB.movs.filter(m=>m.fazenda===faz).map(m=>m.cod))];
  const linhas = cods.map(c=>({p:prod(c), s:saldo(faz,c)})).sort((a,b)=>a.p.nome.localeCompare(b.p.nome));
  const ult = DB.movs.filter(m=>m.tipo==='CONTAGEM' && m.fazenda===faz).map(m=>m.data).sort().pop();
  const fechadoHoje = DB.fechados[faz+'|'+hoje()];
  const pend = DB.movs.filter(m=>m.seq>DB.config.ultimoExport).length;
  $('#app').innerHTML = `
  <div class="card">
    <label>Fazenda / local de estoque</label>
    <select onchange="DB.config.fazenda=this.value;salvar();go('saldo')">${optFaz(faz)}</select>
    <div class="info" style="margin-top:8px">Último fechamento: <b>${ult?dBR(ult):'nenhum'}</b> ·
      Hoje: ${fechadoHoje?'<span class="tag">fechado</span>':'<span class="tag al">em aberto</span>'}</div>
    ${DB.config.urlPlanilha ? (pendSync().length?`<div class="aviso al">${pendSync().length} lançamento(s) aguardando envio para a planilha online. <button class="btn peq" onclick="sincronizar(true)">Enviar agora</button></div>`:`<div class="aviso ok">Planilha online em dia${DB.config.syncEm?' · último envio '+new Date(DB.config.syncEm).toLocaleString('pt-BR'):''}.</div>`) : (pend?`<div class="aviso al">${pend} lançamento(s) ainda não exportado(s) para o escritório. Use <b>Estoque</b> ou <b>Mais › Exportar</b>.</div>`:'')}
  </div>
  <div class="card"><h3>Saldo em campo – ${esc(faz)}</h3>
  ${linhas.length? `<table><tr><th>Produto</th><th class="n">Saldo</th></tr>
    ${linhas.map(l=>`<tr><td>${esc(l.p.nome)}</td><td class="n ${l.s<0?'neg':''}">${fmt(l.s,3)} ${esc(l.p.un)}</td></tr>`).join('')}</table>
    ${linhas.some(l=>l.s<0)?'<div class="aviso er">Saldo negativo indica consumo sem entrada registrada. Verifique NF pendente ou erro de lançamento.</div>':''}`
    : '<p class="info">Nenhuma movimentação nesta fazenda. Comece informando o <b>Estoque</b> de campo.</p>'}
  </div>`;
};

/* ================= LANÇAR ================= */
VIEWS.lancar = ()=>{
  $('#app').innerHTML = `<h2>O que você vai lançar?</h2>
  <div class="grade">
    <button class="tile" onclick="go('f_entrada')"><b>🧾</b>Entrada por NF</button>
    <button class="tile" onclick="go('f_simples','DEVOLUCAO')"><b>↩️</b>Devolução</button>
    <button class="tile" onclick="go('f_simples','PERDA')"><b>⚠️</b>Perda / avaria</button>
    <button class="tile" onclick="go('f_simples','TRANSF_ENVIADA')"><b>📤</b>Transferência enviada</button>
    <button class="tile" onclick="go('f_simples','TRANSF_RECEBIDA')"><b>📥</b>Transferência recebida</button>
  </div>
  <div class="aviso ok" style="margin-top:14px">🌱 <b>Consumo não se lança aqui.</b> Ele já vai no apontamento do WhatsApp. Informe o <b>Estoque</b> de campo no fim do dia e o app calcula o consumo.</div>
  <p class="info" style="margin-top:10px">Saldo inicial, ajuste de inventário e consumo não apontado (exceções) ficam em <b>Mais</b>.</p>`;
};

/* ---------- Consumo ---------- */
let nLin=0;
function linhaConsumo(){
  const i=nLin++;
  return `<div class="lin" id="L${i}" data-i="${i}">
    ${i>0?`<button class="x" onclick="document.getElementById('L${i}').remove()">remover</button>`:''}
    <label>Produto</label><select id="p${i}" onchange="autoDose(${i})">${optProd('')}</select>
    <input type="hidden" id="d${i}">${campoNum('q'+i,'Quantidade aplicada','')}
    <div id="r${i}" class="info"></div></div>`;
}
function autoDose(i){ const p=prod($('#p'+i).value); const d=$('#d'+i); d.value = p.dose!=null ? String(p.dose).replace('.',',') : ''; calcCons(); }
function calcCons(){
  const area=num($('#c_area')?.value);
  document.querySelectorAll('#linhas .lin').forEach(L=>{
    const i=L.dataset.i, cod=$('#p'+i).value, p=prod(cod), d=num($('#d'+i).value), q=num($('#q'+i).value), r=$('#r'+i);
    prevNum($('#q'+i), p.un);
    let h='';
    if(cod && isFinite(area) && isFinite(d) && d>0){
      const pl=area*d; h+=`Planejado: <b>${fmt(pl,3)} ${p.un}</b>`;
      if(isFinite(q)){ const dv=(q-pl)/pl*100, al=Math.abs(dv)>DB.config.tolDose;
        h+=` · Dose real: ${fmt(q/area,3)} ${p.un}/ha · Desvio: <span class="tag ${al?'er':''}">${fmt(dv,1)}%</span>`;
        if(al) h+=`<div class="aviso er">Desvio acima de ±${DB.config.tolDose}%. Confira a quantidade (ex.: 4.200 kg é diferente de 4,2 kg).</div>`; }
    }
    if(cod){ const s=saldo($('#c_faz').value,cod) - (isFinite(q)?q:0); if(s<0) h+=`<div class="aviso al">Saldo ficará negativo (${fmt(s,3)} ${p.un}). Existe entrada (NF) não lançada?</div>`; }
    r.innerHTML=h;
  });
}
VIEWS.f_consumo = ()=>{
  nLin=0;
  $('#app').innerHTML = `<h2>🌱 Consumo não apontado</h2><div class="aviso al">Use só para consumo que <b>não</b> entra no apontamento do WhatsApp (ex.: repasse, replantio fora de OS). O consumo normal é calculado pelo estoque de campo.</div><div class="card" oninput="calcCons()">
    <div class="row"><div><label>Data</label><input type="date" id="c_data" value="${hoje()}"></div>
      <div><label>Fazenda</label><select id="c_faz" onchange="$('#c_tal').innerHTML=optTal(this.value)">${optFaz(DB.config.fazenda)}</select></div></div>
    <input type="hidden" id="c_os" value="">
    <div class="row"><div><label>Talhão</label><select id="c_tal">${optTal(DB.config.fazenda)}</select></div>
      <div><label>Status do talhão</label><select id="c_st"><option>Em andamento</option><option>Fechado</option></select></div></div>
    <label>Atividade</label><select id="c_atv"><option value="">— selecione —</option>${CFG.atividades.map(a=>`<option>${esc(a)}</option>`).join('')}</select>
    ${campoNum('c_area','Área realizada no dia (ha)','ha')}
    <div id="linhas">${linhaConsumo()}</div>
    <button class="btn sec" onclick="document.getElementById('linhas').insertAdjacentHTML('beforeend',linhaConsumo())">+ outro produto na mesma operação</button>
    <label>Motivo de não estar no apontamento</label>${sel('c_obs',M('consumoExcecao'))}
    <button class="btn" onclick="salvarConsumo()">Salvar consumo</button></div>`;
};
function salvarConsumo(){
  const data=$('#c_data').value, faz=$('#c_faz').value, os=$('#c_os').value.trim(), tal=$('#c_tal').value.trim(),
        atv=$('#c_atv').value, area=num($('#c_area').value), st=$('#c_st').value, obs=$('#c_obs').value.trim();
  const err=[]; if(!data) err.push('data'); if(!tal) err.push('talhão'); if(!atv) err.push('atividade'); if(!(area>0)) err.push('área (ha)'); if(obs.length<3) err.push('motivo');
  const itens=[];
  document.querySelectorAll('#linhas .lin').forEach(L=>{ const i=L.dataset.i, cod=$('#p'+i).value, d=num($('#d'+i).value), q=num($('#q'+i).value);
    if(!cod && !$('#q'+i).value) return; if(!cod) err.push('produto'); if(!(q>0)) err.push('quantidade aplicada'); itens.push({cod,d,q}); });
  if(!itens.length) err.push('ao menos um produto');
  if(err.length) return alert('Preencha: '+[...new Set(err)].join(', '));
  for(const it of itens){ if(isFinite(it.d)&&it.d>0){ const dv=(it.q-area*it.d)/(area*it.d)*100; it.dv=dv;
      if(Math.abs(dv)>DB.config.tolDose && !confirm('Desvio de dose de '+fmt(dv,1)+'% em '+prod(it.cod).nome+'. A quantidade está correta?')) return; if(false) return alert('Há desvio de dose acima de ±'+DB.config.tolDose+'% em '+prod(it.cod).nome+'. Escreva a justificativa na observação.'); } }
  if(DB.fechados[faz+'|'+data] && !confirm('O dia '+dBR(data)+' já foi fechado. O lançamento ficará marcado como "após fechamento". Continuar?')) return;
  itens.forEach(it=> registrar({tipo:'CONSUMO', data, fazenda:faz, cod:it.cod, qtd:it.q, os, atividade:atv, talhao:tal, area,
    dose:isFinite(it.d)?it.d:'', planejado:isFinite(it.d)?Math.round(area*it.d*1000)/1000:'', desvio:isFinite(it.dv)?Math.round(it.dv*10)/10:'', status:st, obs}));
  salvar(); toast('Consumo não apontado salvo ✔'); go('saldo');
}

function linhaNF(){

    <div id="r${i}"></div></div>`;
}
function calcNF(){ document.querySelectorAll('#linhas .lin').forEach(L=>{ const i=L.dataset.i, p=prod($('#p'+i).value), n=num($('#n'+i).value), q=num($('#q'+i).value);

VIEWS.f_entrada = ()=>{

  $('#app').innerHTML = `<h2>🧾 Entrada por nota fiscal</h2><div class="card" oninput="calcNF()">
    <div class="row"><div><label>Data do recebimento</label><input type="date" id="e_data" value="${hoje()}"></div>
      <div><label>Fazenda (destino)</label><select id="e_faz">${optFaz(DB.config.fazenda)}</select></div></div>
    <div class="row"><div><label>Nº da NF</label><input id="e_nf" inputmode="numeric"></div>
      <div><label>Origem</label>${sel('e_or',CFG.origens,{val:CFG.origens[0]})}</div></div>
    <div class="row"><div><label>Quem retirou / conferiu</label>${sel('e_resp',[...CFG.lideres.map(l=>l.nome),...CFG.supervisores],{val:DB.config.lider})}</div>
      <div><label>Transporte</label>${sel('e_pl',CFG.motoristas,{vazio:'— não informar —'})}</div></div>
    <div id="linhas">${linhaNF()}</div>
    <button class="btn sec" onclick="document.getElementById('linhas').insertAdjacentHTML('beforeend',linhaNF())">+ outro produto da mesma NF</button>
    <label>Se a NF não confere, qual o motivo?</label>${sel('e_obs',M('divergenciaNF'),{vazio:'— NF confere —'})}
    <div class="aviso al">📷 Tire foto da NF e envie no grupo citando o nº da NF. A foto é a evidência da auditoria.</div>
    <button class="btn" onclick="salvarNF()">Salvar entrada</button></div>`;
};
function salvarNF(){
  const data=$('#e_data').value, faz=$('#e_faz').value, nf=$('#e_nf').value.trim(), or=$('#e_or').value.trim(), resp=$('#e_resp').value.trim(), pl=$('#e_pl').value.trim(), obs=$('#e_obs').value.trim();
  const err=[]; if(!nf) err.push('nº da NF'); if(!resp) err.push('quem retirou'); const itens=[];
  document.querySelectorAll('#linhas .lin').forEach(L=>{ const i=L.dataset.i, cod=$('#p'+i).value, n=num($('#n'+i).value), q=num($('#q'+i).value);
    if(!cod && !$('#q'+i).value) return; if(!cod) err.push('produto'); if(!(q>=0)||!isFinite(q)) err.push('qtd conferida'); if(!(n>0)) err.push('qtd na NF'); itens.push({cod,n,q}); });
  if(!itens.length) err.push('ao menos um produto');
  if(err.length) return alert('Preencha: '+[...new Set(err)].join(', '));
  if(itens.some(it=>Math.abs(it.n-it.q)>0.0005) && obs.length<3) return alert('Há divergência entre NF e conferido. Selecione o motivo.');
  if(DB.movs.some(m=>m.tipo==='ENTRADA_NF' && m.nf===nf && !estornado(m.id)) && !confirm('A NF '+nf+' já foi lançada neste celular. Lançar de novo?')) return;
  itens.forEach(it=> registrar({tipo:'ENTRADA_NF', data, fazenda:faz, cod:it.cod, qtd:it.q, qtdNF:it.n, nf, origem:or, responsavel:resp, placa:pl, obs}));
  salvar(); toast('Entrada salva ✔'); go('saldo');
}

/* ================= FECHAR DIA ================= */
VIEWS.fechar = (dataSel)=>{
  const faz=DB.config.fazenda, data=dataSel||hoje();
  const jaF = DB.fechados[faz+'|'+data];
  const contDia = c => DB.movs.filter(m=>m.tipo==='CONTAGEM'&&m.fazenda===faz&&m.data===data&&m.cod===c&&!estornado(m.id)).pop();
  const cods=[...new Set(DB.movs.filter(m=>m.fazenda===faz && m.data<=data).map(m=>m.cod))].filter(c=>Math.abs(saldo(faz,c,data))>0.0005 || DB.movs.some(m=>m.cod===c&&m.fazenda===faz&&m.data===data));
  $('#app').innerHTML = `<h2>✅ Estoque de campo</h2><div class="card">
    <div class="row"><div><label>Data</label><input type="date" id="f_data" value="${data}" onchange="go('fechar',this.value)"></div>
      <div><label>Fazenda</label><select onchange="DB.config.fazenda=this.value;salvar();go('fechar','${data}')">${optFaz(faz)}</select></div></div>
    ${jaF?`<div class="aviso ok">Dia já fechado em ${new Date(jaF).toLocaleString('pt-BR')}. Você pode reenviar a mensagem abaixo.</div>`:''}
    <p class="info">No fim do dia, conte o que está no campo (bags, sacos, caixas de muda) e digite só a quantidade. <b>O app calcula o consumo do dia</b>. Lance antes as entradas e perdas do dia.</p>
    ${cods.length? `<table><tr><th>Produto</th><th class="n">Saldo antes</th><th class="n" style="width:34%">Contagem</th></tr>
      ${cods.map((c,i)=>{const p=prod(c), k=contDia(c), s=k?k.saldoSistema:saldo(faz,c,data); return `<tr><td>${esc(p.nome)}<div class="prev" id="fd${i}">${k?`consumo do dia: <b>${fmt(k.consumoDia,3)} ${p.un}</b>`:''}</div></td><td class="n">${fmt(s,3)} ${p.un}</td>
      <td><input id="fc${i}" data-cod="${esc(c)}" data-s="${s}" data-un="${esc(p.un)}" inputmode="decimal" oninput="difF(${i})" ${jaF?`disabled value="${k?String(k.contagem).replace('.',','):''}"`:''}></td></tr>`;}).join('')}</table>
      ${jaF?'':`<label>Tem produto no campo que não está na lista?</label><select onchange="addProdF(this)"><option value="">+ incluir produto</option>${DB.produtos.filter(p=>!cods.includes(p.cod)).map(p=>`<option value="${esc(p.cod)}">${esc(p.nome)}</option>`).join('')}</select>`}
      <label>Se sobrou produto, qual o motivo?</label>${sel('f_obs',M('sobra'),{vazio:'— não houve sobra —'})}
      ${jaF?'':`<button class="btn" onclick="fecharDia('${data}')">Salvar estoque e gerar informe</button>`}`
    : `<p class="info">Primeiro uso nesta fazenda: inclua cada produto que está no campo e informe a quantidade.</p><table><tr><th>Produto</th><th class="n">Saldo antes</th><th class="n" style="width:34%">Contagem</th></tr></table><label>Produto</label><select onchange="addProdF(this)"><option value="">+ incluir produto</option>${DB.produtos.map(p=>`<option value="${esc(p.cod)}">${esc(p.nome)}</option>`).join('')}</select><input type="hidden" id="f_obs" value=""><button class="btn" onclick="fecharDia('${data}')">Salvar estoque e gerar informe</button>`}
    </div><div id="saida">${jaF?saidaHTML(faz,data):''}</div>`;
};
let nF=100;
function addProdF(se){ const c=se.value; if(!c) return; const p=prod(c), i=nF++; se.querySelector('option[value="'+c+'"]').remove(); se.value='';
  $('#app table').insertAdjacentHTML('beforeend',`<tr><td>${esc(p.nome)}<div class="prev" id="fd${i}"></div></td><td class="n">novo</td><td><input id="fc${i}" data-cod="${esc(c)}" data-s="0" data-novo="1" data-un="${esc(p.un)}" inputmode="decimal" oninput="difF(${i})"></td></tr>`); $('#fc'+i).focus(); }
function difF(i){ const el=$('#fc'+i), s=Number(el.dataset.s), c=num(el.value), d=$('#fd'+i), un=el.dataset.un||''; if(!el.value){d.textContent='';return;}
  if(!isFinite(c)){d.textContent='⚠ número inválido';return;} if(el.dataset.novo){ d.innerHTML='<span class="tag">primeiro estoque informado: '+fmt(c,3)+' '+un+'</span>'; return; } const cons=s-c;
  if(Math.abs(cons)<0.0005) d.innerHTML='<span class="tag cz">sem consumo hoje</span>';
  else if(cons>0) d.innerHTML=`consumo do dia: <b>${fmt(cons,3)} ${un}</b>`+(s>0&&cons/s>0.9&&c>0?'':'' );
  else d.innerHTML=`<span class="tag er">sobra de ${fmt(-cons,3)} ${un}</span> — tem entrada não lançada? Selecione o motivo abaixo.`; }
function fecharDia(data){
  const faz=DB.config.fazenda, obs=$('#f_obs').value.trim(); const regs=[]; let falta=false, sobra=false;
  document.querySelectorAll('[id^=fc]').forEach(el=>{ const c=num(el.value), s=Number(el.dataset.s);
    if(!el.value || !isFinite(c) || c<0){ falta=true; return; }
    const novo=!!el.dataset.novo, cons=novo?0:Math.round((s-c)*1000)/1000; if(cons<-0.0005) sobra=true;
    regs.push({cod:el.dataset.cod, s:novo?c:s, c, cons, novo}); });
  if(!regs.length) return alert('Inclua ao menos um produto.');
  if(falta) return alert('Informe a contagem física de todos os produtos (use 0 se não houver).');
  if(sobra && obs.length<3) return alert('A contagem ficou MAIOR que o saldo (sobra). Verifique se falta lançar alguma entrada e selecione o motivo.');
  const resumo=regs.filter(r=>r.cons>0.0005).map(r=>prod(r.cod).nome+': '+fmt(r.cons,3)+' '+prod(r.cod).un).join('\n');
  if(!confirm('Confirma o estoque de campo?\n\nConsumo do dia calculado:\n'+(resumo||'nenhum')+'\n\nDepois de salvo, só o supervisor reabre.')) return;
  regs.filter(r=>r.novo).forEach(r=> registrar({tipo:'SALDO_INICIAL', data, fazenda:faz, cod:r.cod, qtd:r.c, obs:'Primeiro estoque de campo informado'}));
  regs.forEach(r=> registrar({tipo:'CONTAGEM', data, fazenda:faz, cod:r.cod, qtd:r.c, mov:r.c-r.s, saldoSistema:r.s, contagem:r.c, consumoDia:r.cons, diferenca:Math.round((r.c-r.s)*1000)/1000, difPct:r.s?Math.round((r.c-r.s)/Math.abs(r.s)*1000)/10:0, obs}));
  DB.fechados[faz+'|'+data]=agora(); salvar(); toast('Estoque salvo ✔'); go('fechar',data); sincronizar(false);
}
function msgFechamento(faz,data){
  const dm=DB.movs.filter(m=>m.fazenda===faz && m.data===data && !estornado(m.id) && m.tipo!=='ESTORNO');
  const L=[`📦 *INFORME DE INSUMOS – ${dBR(data)}*`, `🏞️ Fazenda: ${faz}`, `👨‍💼 Líder: ${DB.config.lider}${DB.config.equipe?' · Equipe '+DB.config.equipe:''}`, ''];
  const ent=dm.filter(m=>['ENTRADA_NF','TRANSF_RECEBIDA','SALDO_INICIAL'].includes(m.tipo));
  if(ent.length){ L.push('🧾 *Entradas*'); ent.forEach(m=>L.push(`• ${m.tipo==='SALDO_INICIAL'?'[primeiro estoque] ':m.tipo==='TRANSF_RECEBIDA'?'[transf. recebida] ':''}${m.produto}: ${fmt(m.qtd,3)} ${m.un}${m.nf?' (NF '+m.nf+')':''}${m.qtdNF!==undefined&&Math.abs(m.qtdNF-m.qtd)>0.0005?' ⚠ NF: '+fmt(m.qtdNF,3):''}`)); L.push(''); }
  const con=dm.filter(m=>m.tipo==='CONSUMO');
  if(con.length){ L.push('🌱 *Consumo não apontado (exceção)*'); con.forEach(m=>L.push(`• T${m.talhao} – ${m.atividade} – ${fmt(m.area,2)} ha${m.os?' – OS '+m.os:''}\n   ${m.produto}: ${fmt(m.qtd,3)} ${m.un}${m.dose!==''?' (dose '+fmt(m.dose,3)+'/ha, desvio '+fmt(m.desvio,1)+'%)':''} – ${m.status}`)); L.push(''); }
  const out=dm.filter(m=>['DEVOLUCAO','PERDA','TRANSF_ENVIADA'].includes(m.tipo));
  if(out.length){ L.push('↩️ *Devoluções / perdas / transferências*'); out.forEach(m=>L.push(`• ${TIPOS[m.tipo].nome}: ${m.produto} ${fmt(m.qtd,3)} ${m.un}${m.obs?' – '+m.obs:''}`)); L.push(''); }
  const cont=dm.filter(m=>m.tipo==='CONTAGEM');
  if(cont.length){ L.push('🌱 *Consumo do dia (pela contagem)*');
    const cc=cont.filter(m=>m.consumoDia>0.0005); if(cc.length) cc.forEach(m=>L.push(`• ${m.produto}: ${fmt(m.consumoDia,3)} ${m.un}`)); else L.push('• sem consumo');
    L.push(''); }
  L.push('📊 *Saldo em campo (contado)*');
  if(cont.length) cont.forEach(m=>L.push(`• ${m.produto}: ${fmt(m.contagem,3)} ${m.un}${m.consumoDia<-0.0005?` ⚠ sobra de ${fmt(-m.consumoDia,3)}`:''}`));
  else [...new Set(DB.movs.filter(m=>m.fazenda===faz).map(m=>m.cod))].forEach(c=>{const s=saldo(faz,c,data); if(Math.abs(s)>0.0005) L.push(`• ${prod(c).nome}: ${fmt(s,3)} ${prod(c).un}`);});
  const ob=cont.find(m=>m.obs); if(ob) L.push('', '📝 '+ob.obs);
  L.push('', `_Controle de Insumos JFI · disp. ${DB.config.dispositivo}_`);
  return L.join('\n');
}
function saidaHTML(faz,data){
  const t=msgFechamento(faz,data);
  return `<div class="card"><h3>Informe para o grupo</h3><pre class="msg" id="msg">${esc(t)}</pre>
  <button class="btn" onclick="enviarWhats()">Enviar no WhatsApp</button>
  ${DB.config.urlPlanilha?'<button class="btn" onclick="sincronizar(true)">Enviar para a planilha online</button>':''}
  <button class="btn sec" onclick="exportarCSV(true)">Enviar arquivo para o escritório (CSV)</button></div>`;
}
function enviarWhats(){ const t=$('#msg').textContent; if(navigator.share){ navigator.share({text:t}).catch(()=>{}); } else location.href='https://wa.me/?text='+encodeURIComponent(t); }

      ${m.talhao?' · T'+esc(m.talhao):''}${m.nf?' · Doc/NF '+esc(m.nf):''}${m.ref?' · ref '+esc(m.ref):''}

      ${m.obs?'<br>'+esc(m.obs):''}</div>
      ${(!est && m.tipo!=='ESTORNO')?`<button class="btn peq perigo" style="margin-top:6px" onclick="estornar('${m.id}')">Estornar</button>`:''}</div>`;}).join('')}

};
function estornar(id){

VIEWS.f_estorno = (id)=>{ const m=DB.movs.find(x=>x.id===id), fe=m.tipo==='CONTAGEM';

/* ================= PLANILHA ONLINE ================= */
const pendSync = () => DB.movs.filter(m=>m.seq>(DB.config.ultimoSync||0));
let sincronizando=false;
async function sincronizar(manual){
  const c=DB.config; if(!c.urlPlanilha){ if(manual) alert('Configure o endereço da planilha online em Mais › Líder, fazendas e tolerâncias.'); return; }
  const ms=pendSync(); if(!ms.length){ if(manual) toast('Planilha já está em dia ✔'); return; }
  if(!navigator.onLine){ if(manual) alert('Sem internet agora. Os lançamentos ficam guardados e vão quando houver sinal.'); return; }
  if(sincronizando) return; sincronizando=true;
  try{
    const movs=ms.map(m=>{ const o={}; COLS.forEach(([h,k])=>{ if(m[k]!==undefined && m[k]!=='') o[h]=m[k]; }); return o; });
    const r=await fetch(c.urlPlanilha,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({chave:c.chave,dispositivo:c.dispositivo,lider:c.lider,movs})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.erro||'resposta inválida');
    c.ultimoSync=ms[ms.length-1].seq; c.syncEm=agora(); salvar();
    toast('Planilha atualizada ✔ ('+j.novos+' novo'+(j.novos===1?'':'s')+')'); if(VIEW==='saldo'||VIEW==='mais') go(VIEW);
  }catch(e){ if(manual) alert('Não foi possível enviar para a planilha: '+e.message+'\nUse o envio por CSV se continuar.'); }
  finally{ sincronizando=false; }
}
addEventListener('online',()=>sincronizar(false));

/* ================= EXPORTAÇÃO ================= */
const COLS = [['ID','id'],['Seq','seq'],['Dispositivo','dispositivo'],['Lider','lider'],['Data','data'],['Registrado_em','criado'],['Tipo','tipo'],['Fazenda','fazenda'],
  ['Cod_Produto','cod'],['Produto','produto'],['Unidade','un'],['Quantidade','qtd'],['Mov_Saldo','mov'],['NF_Documento','nf'],['Qtd_NF','qtdNF'],['Origem','origem'],
  ['Responsavel','responsavel'],['Placa','placa'],['OS','os'],['Atividade','atividade'],['Talhao','talhao'],['Area_ha','area'],['Dose_Rec_ha','dose'],['Qtd_Planejada','planejado'],
  ['Desvio_pct','desvio'],['Status_Talhao','status'],['Saldo_Sistema','saldoSistema'],['Contagem','contagem'],['Diferenca','diferenca'],['Dif_pct','difPct'],['Consumo_Dia','consumoDia'],['Ref_Estorno','ref'],['Apos_Fechamento','aposFechamento'],['Observacao','obs']];
function csv(movs){
  const cel=v=>{ if(v===undefined||v===null) return ''; if(typeof v==='number') return String(v).replace('.',','); v=String(v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const fixData = (k,v)=> k==='data'&&v ? dBR(v) : k==='criado'&&v ? new Date(v).toLocaleString('pt-BR') : v;
  return '﻿'+[COLS.map(c=>c[0]).join(';'), ...movs.map(m=>COLS.map(([,k])=>cel(fixData(k,m[k]))).join(';'))].join('\r\n');
}
async function compartilharArquivo(nome, conteudo, tipo){
  const blob=new Blob([conteudo],{type:tipo});
  try{ const f=new File([blob],nome,{type:tipo});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:nome, text:'Controle de Insumos – '+DB.config.lider}); return true; } }catch(e){ if(e.name==='AbortError') return false; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove(); return true;
}
async function exportarCSV(soNovos){
  const ms = soNovos ? DB.movs.filter(m=>m.seq>DB.config.ultimoExport) : DB.movs;
  if(!ms.length) return alert('Não há lançamentos novos para exportar.');
  const nome=`insumos_${DB.config.dispositivo}_${(DB.config.lider||'lider').split(' ')[0]}_${hoje()}_seq${ms[0].seq}-${ms[ms.length-1].seq}.csv`;
  const ok = await compartilharArquivo(nome, csv(ms), 'text/csv');
  if(ok){ DB.config.ultimoExport = Math.max(DB.config.ultimoExport, ms[ms.length-1].seq); salvar(); toast('Arquivo gerado ✔'); }
}
function backup(){ compartilharArquivo(`backup_insumos_${DB.config.dispositivo}_${hoje()}.json`, JSON.stringify(DB), 'application/json'); }
function restaurar(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.movs||!d.config) throw 0;
  if(!confirm('Restaurar substitui os dados deste celular por '+d.movs.length+' lançamentos do backup. Continuar?')) return; DB=d; salvar(); toast('Backup restaurado ✔'); go('saldo'); }catch(e){ alert('Arquivo de backup inválido.'); } }; r.readAsText(f); }
